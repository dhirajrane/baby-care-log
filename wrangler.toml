name = "baby-care-log"
main = "dist/worker.js"
compatibility_date = "2024-11-01"

# Builds the app (inlines public/ into the worker) before every deploy.
[build]
command = "node scripts/build.mjs"

# Paste your D1 database ID below (Cloudflare → Storage & Databases → D1 → baby-care-log).
[[d1_databases]]
binding = "DB"
database_name = "baby-care-log"
database_id = "cad56037-7f4b-4310-bb54-a5500aa80028"

# Checks for due feed and pumping reminders every minute.
[triggers]
crons = ["* * * * *"]

# ---------- Staging copy ----------
# Its own Worker and its own database, so testing never touches the family's real log.
# Deploy: npx wrangler deploy --env staging   (or npm run deploy:staging)
# Settings are not inherited by environments, so the database and the cron are repeated here.
[env.staging]
name = "baby-care-log-staging"
vars = { APP_ENV = "staging" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "baby-care-log-staging"
database_id = "PASTE-STAGING-DATABASE-ID-HERE"

[env.staging.triggers]
crons = ["* * * * *"]
