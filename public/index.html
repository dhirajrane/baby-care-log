<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby Care Log</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.by{font-size:12px;color:var(--muted);margin-top:2px}
.login-err{color:var(--danger);font-size:13px;margin:0;min-height:1em}
/* Layout: single-column phone app, sticky header, fixed bottom tabs, sheets slide up from the bottom */
:root{
  --bg:#edf0f6; --surface:#ffffff; --surface-2:#f6f7fb; --ink:#1c2133; --muted:#5b6377; --line:#d8dde9;
  --feed:#a83f74; --feed-soft:#f5e2ec; --wet:#2c78c2; --wet-soft:#dfecf9; --dirty:#9a6a22; --dirty-soft:#f3e8d5;
  --growth:#2e8a6a; --growth-soft:#dcf1e8; --pump:#6a4fc2; --danger:#b3261e; --shadow:0 1px 2px rgba(28,33,51,.06),0 6px 20px rgba(28,33,51,.06);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11141c; --surface:#1a1e29; --surface-2:#212634; --ink:#e7e9f1; --muted:#9ba2b6; --line:#2d3343;
  --feed:#e584b4; --feed-soft:#3a2333; --wet:#72b1ef; --wet-soft:#1b2c41; --dirty:#d8a75e; --dirty-soft:#352a19;
  --growth:#6bd0a8; --growth-soft:#17332a; --pump:#ab97f2; --danger:#ff8a80; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#1a1e29; --surface-2:#212634; --ink:#e7e9f1; --muted:#9ba2b6; --line:#2d3343;
  --feed:#e584b4; --feed-soft:#3a2333; --wet:#72b1ef; --wet-soft:#1b2c41; --dirty:#d8a75e; --dirty-soft:#352a19;
  --growth:#6bd0a8; --growth-soft:#17332a; --pump:#ab97f2; --danger:#ff8a80; --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--feed);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1.1;text-wrap:balance}
.top .age{color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.notice{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
main{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* status */
.status{display:flex;flex-direction:column;gap:10px}
.status .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.status .sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--feed-soft);color:var(--feed)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.feed b{color:var(--feed)} .stat.wet b{color:var(--wet)} .stat.dirty b{color:var(--dirty)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;border-radius:16px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:16px}
.act small{font-weight:500;font-size:12.5px;opacity:.8}
.act.feed{background:var(--feed);color:var(--surface)}
.act.diaper{background:var(--wet);color:var(--surface)}
.act.pump{background:var(--pump);color:var(--surface);grid-column:1/-1;flex-direction:row;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 14px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:9px;height:9px;border-radius:50%}

/* timeline */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:54px 12px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding-top:1px}
.item .dot{width:12px;height:12px;border-radius:50%;margin-top:5px}
.item .body{min-width:0}
.item .ttl{font-weight:600}
.item .note{color:var(--muted);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.c-pump{background:var(--pump)} .c-feed{background:var(--feed)} .c-wet{background:var(--wet)} .c-dirty{background:var(--dirty)} .c-both{background:linear-gradient(90deg,var(--wet) 50%,var(--dirty) 50%)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.dayhead .tot{font-size:12.5px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--bg);padding-block:4px 8px;box-shadow:0 -10px 0 var(--bg)}
.filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 6px}
.ov div{background:var(--surface-2);border-radius:12px;padding:9px 10px;min-width:0}
.ov b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums}
.ov span{font-size:11.5px;color:var(--muted);display:block}
.ov .k-feed b{color:var(--feed)} .ov .k-wet b{color:var(--wet)} .ov .k-dirty b{color:var(--dirty)} .ov .k-pump b{color:var(--pump)}
@media (max-width:360px){.ov{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.more{margin-top:4px}

/* charts */
.chart-wrap{overflow-x:auto}
svg.chart{display:block;width:100%;height:auto}
svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--ink);color:var(--surface)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.green{background:var(--growth);color:var(--surface)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
table.gt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.gt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 4px}
table.gt td{padding:9px 4px;border-top:1px solid var(--line)}
table.gt tr[data-edit]{cursor:pointer}
.delta{font-size:12px;color:var(--growth);font-weight:600}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mbody{min-width:0;flex:1 1 180px}
.mdate{font-size:12.5px;color:var(--muted);font-weight:600}
.mrow .note{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.chip.danger-armed{border-color:var(--danger);color:var(--danger)}
.footnote{font-size:12px;color:var(--muted);margin-top:8px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--feed)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet form{display:flex;flex-direction:column;gap:14px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--surface-2);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.field input,.field textarea,.field select{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;inset:0}
.radios span{display:inline-block;padding:9px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);background:var(--surface)}
.radios input:checked + span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.radios input:focus-visible + span{outline:2px solid var(--feed);outline-offset:2px}
.form-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.form-actions .btn:not(.danger){flex:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.rem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rem:first-of-type{border-top:0}
.rem b{font-weight:700}
.rem .sub{font-size:13px;color:var(--muted)}
.rem.over .sub{color:var(--danger);font-weight:600}
.rem-btns{display:flex;gap:6px;flex-wrap:wrap}
.rem-btns .chip{padding:6px 12px;font-size:13px}
.alert{background:var(--feed-soft);border:1px solid var(--feed);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.alert.pump{background:var(--surface-2);border-color:var(--pump)}
.alert .sub{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--feed);flex:none}
.auto-row{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:end}
.toast button{border:0;background:none;color:var(--surface);text-decoration:underline;font-weight:700}
.setup{display:flex;flex-direction:column;gap:12px}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>

</head>
<body>
<div class="app">
  <header class="top"><h1 id="hd-name">Baby Care Log</h1><span class="age" id="hd-age"></span></header>
  <div id="notice"></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Today</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>History</button>
  <button data-tab="growth"><svg viewBox="0 0 24 24"><path d="M3 18c4-1 6-4 8-8s5-6 10-6"/><circle cx="21" cy="4" r="1.2"/></svg>Growth</button>
  <button data-tab="baby"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4.5"/><path d="M4.5 21c1.2-3.6 4-5.2 7.5-5.2s6.3 1.6 7.5 5.2"/></svg>Baby</button>
</div></nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
(function(){
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DAY=864e5;
const toLocalInput=ms=>{const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayKey=ms=>toLocalInput(ms).slice(0,10);
const keyToMs=k=>{const[Y,M,D]=k.split('-').map(Number);return new Date(Y,M-1,D).getTime()};
const fmtTime=ms=>new Date(ms).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const fmtDay=k=>{if(k===dayKey(Date.now()))return'Today';if(k===dayKey(Date.now()-DAY))return'Yesterday';return new Date(keyToMs(k)).toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})};
const fmtDate=ms=>new Date(ms).toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'});
const ago=ms=>{const m=Math.max(0,Math.floor((Date.now()-ms)/60000));if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<48)return h+'h '+pad(m%60)+'m ago';return Math.floor(h/24)+' days ago'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const numOrNull=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};

const FEED={breast:'Breast',bottle:'Expressed milk',formula:'Formula',solids:'Solids'};
const SIDE={L:'Left',R:'Right',both:'Both sides'};
const DIAPER={wet:'Wet',dirty:'Dirty',both:'Wet + dirty'};
const COLORS=['Yellow','Mustard','Green','Brown','Black','Other'];

// WHO weight-for-age, months 0–12 (kg): 3rd, 50th, 97th percentile
const WHO={
  girl:{p3:[2.4,3.2,4.0,4.6,5.1,5.5,5.8,6.1,6.3,6.6,6.8,7.0,7.1],p50:[3.2,4.2,5.1,5.8,6.4,6.9,7.3,7.6,7.9,8.2,8.5,8.7,8.9],p97:[4.2,5.4,6.5,7.4,8.1,8.7,9.2,9.6,10.0,10.4,10.7,11.0,11.3]},
  boy:{p3:[2.5,3.4,4.4,5.1,5.6,6.1,6.4,6.7,7.0,7.2,7.5,7.7,7.8],p50:[3.3,4.5,5.6,6.4,7.0,7.5,7.9,8.3,8.6,8.9,9.2,9.4,9.6],p97:[4.4,5.8,7.1,8.0,8.7,9.3,9.8,10.3,10.7,11.0,11.4,11.7,12.0]}
};

// ---------- state ----------
const REM_DEFAULT={feed:{auto:false,hours:3},pump:{auto:false,hours:3},due:{feed:null,pump:null}};
const mergeRem=d=>({feed:{...REM_DEFAULT.feed,...((d&&d.feed)||{})},pump:{...REM_DEFAULT.pump,...((d&&d.pump)||{})},due:{feed:null,pump:null,...((d&&d.due)||{})},tz:(d&&d.tz)||undefined});
const S={hFilter:'all',rem:mergeRem(null),profile:{},events:[],growth:[],tab:'today',metric:'kg',historyDays:7,loading:true,online:true,devices:null};
const LS='babycarelog.app.v1',LSK='babycarelog.key',LSM='babycarelog.member',LSF='babycarelog.family';
const AUTH={key:null,member:'',family:'',status:null,error:''};
try{AUTH.key=localStorage.getItem(LSK);AUTH.member=localStorage.getItem(LSM)||'';AUTH.family=localStorage.getItem(LSF)||''}catch(e){}
let outbox=[],since=0,flushing=false;
const sortAll=()=>{S.events.sort((a,b)=>b.t-a.t);S.growth.sort((a,b)=>b.t-a.t)};
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.profile=d.profile||{};S.events=d.events||[];S.growth=d.growth||[];S.rem=mergeRem(d.rem);since=d.since||0;outbox=d.outbox||[];sortAll();if(S.events.length||S.growth.length)S.loading=false}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,events:S.events,growth:S.growth,rem:S.rem,since,outbox}))}catch(e){}}
const tz=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return undefined}};

async function api(path,opts={}){
  let r;
  try{r=await fetch('/api'+path,{method:opts.method||'GET',cache:'no-store',headers:{'content-type':'application/json','x-family-key':AUTH.key||''},body:opts.body!==undefined?JSON.stringify(opts.body):undefined})}
  catch(e){throw{code:'offline'}}
  let data=null;try{data=await r.json()}catch(e){}
  if(r.status===401&&!opts.noAuth){signOut('The family key was changed or is wrong. Enter it again.');throw{code:'auth'}}
  if(!r.ok)throw{code:'http',status:r.status,data};
  return data;
}
function enqueue(op){outbox=outbox.filter(o=>o.path!==op.path);outbox.push(op);lsSave();flush()}
async function flush(){
  if(flushing||!AUTH.key)return;flushing=true;let changed=false;
  try{
    while(outbox.length){
      const op=outbox[0];
      try{const res=await api(op.path,{method:op.method,body:op.body});if(res&&res.rem){S.rem=mergeRem(res.rem);changed=true}S.online=true}
      catch(e){if(e.code==='http'&&e.status>=400&&e.status<500){/* rejected for good: drop it */}else{S.online=false;break}}
      outbox.shift();lsSave();changed=true;
    }

function barsChart(){

  const step=max<=8?2:max<=16?4:5;const top=Math.ceil(max/step)*step;const y=v=>T+(H-T-B)*(1-v/top);

    if(i%2===1||i===13){const dt=new Date(keyToMs(d.k));g+=`<text x="${x}" y="${H-8}" text-anchor="middle">${i===13?'Today':dt.getDate()}</text>`}

const HF={all:'All',feed:'Feeds',diaper:'Diapers',pump:'Pumping'};
function feedGap(list){

function dayOverview(list,f){

  if(f==='all'||f==='pump'){

    if(f==='pump'){const pm=list.filter(e=>e.type==='pump').reduce((s,e)=>s+(+e.min||0),0);tiles.push(tile('k-pump',pm?pm+' min':'–','pumping time'));tiles.push(tile('k-pump',t.pumps?Math.round(t.pumped/t.pumps)+' ml':'–','per session'))}

function niceStep(r){const raw=r/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
const grams=kg=>Math.round(kg*1000).toLocaleString();
function growthChart(metric){
  const F=metric==='kg'?1000:1;const pts=S.growth.filter(g=>g[metric]!=null).map(g=>({t:g.t,v:Math.round(+g[metric]*F*10)/10})).sort((a,b)=>a.t-b.t);
  if(!pts.length)return `<p class="empty">No ${metric==='kg'?'weight':metric==='cm'?'length':'head'} measurements yet. Add one after the next weigh-in at the consultatiebureau or at home.</p>`;
  const birth=S.profile.birth?keyToMs(S.profile.birth):null;const base=birth??pts[0].t;const age=t=>(t-base)/(30.4375*DAY);
  const xs=pts.map(p=>age(p.t));const xmax=Math.min(36,Math.max(birth?3:1,Math.ceil(Math.max(...xs)+0.3)));
  const W0=(metric==='kg'&&birth&&WHO[S.profile.sex])?WHO[S.profile.sex]:null;const ref=W0?{p3:W0.p3.map(v=>v*F),p50:W0.p50.map(v=>v*F),p97:W0.p97.map(v=>v*F)}:null;const refMax=Math.min(12,Math.floor(xmax));
  let vals=pts.map(p=>p.v);if(ref){for(let m=0;m<=refMax;m++){vals.push(ref.p3[m],ref.p97[m])}}
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<F){lo-=F/2;hi+=F/2}
  const st=niceStep(hi-lo);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const W=340,H=230,L=38,R=16,T=14,B=34;const X=a=>L+(W-L-R)*a/xmax;const Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';const dec=st<1?1:0;
  for(let v=lo;v<=hi+1e-9;v+=st)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${v.toFixed(dec)}</text>`;
  const xs2=xmax<=6?1:xmax<=12?2:xmax<=24?3:6;
  for(let m=0;m<=xmax;m+=xs2)g+=`<text x="${X(m)}" y="${H-B+14}" text-anchor="middle">${m}</text>`;
  g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">${birth?'age in months':'months since first measurement'}</text>`;
  if(ref){
    const top=[],bot=[];for(let m=0;m<=refMax;m++){top.push(`${X(m)},${Y(ref.p97[m])}`);bot.unshift(`${X(m)},${Y(ref.p3[m])}`)}
    g+=`<polygon points="${top.concat(bot).join(' ')}" fill="var(--growth-soft)" stroke="none"/>`;
    g+=`<polyline points="${ref.p50.slice(0,refMax+1).map((v,m)=>`${X(m)},${Y(v)}`).join(' ')}" fill="none" stroke="var(--growth)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".8"/>`;
  }
  const col=metric==='kg'?'var(--feed)':metric==='cm'?'var(--wet)':'var(--dirty)';
  if(pts.length>1)g+=`<polyline points="${pts.map(p=>`${X(age(p.t))},${Y(p.v)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;g+=`<circle cx="${X(age(p.t))}" cy="${Y(p.v)}" r="${last?5:3.2}" fill="${last?col:'var(--surface)'}" stroke="${col}" stroke-width="2"><title>${fmtDate(p.t)}: ${p.v}${metric==='kg'?' g':' cm'}</title></circle>`});
  const lp=pts[pts.length-1];const lx=X(age(lp.t)),ly=Y(lp.v);const unit=metric==='kg'?' g':' cm';
  g+=`<text x="${Math.min(lx,W-R-2)}" y="${ly-10}" text-anchor="${lx>W-70?'end':'middle'}" style="fill:var(--ink);font-weight:700;font-size:11px">${lp.v}${unit}</text>`;
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth chart">${g}</svg></div>
  ${ref?`<div class="legend"><span><i style="background:var(--growth-soft);border:1px solid var(--growth)"></i>WHO 3rd–97th percentile (${S.profile.sex==='girl'?'girls':'boys'})</span><span><i style="background:var(--growth);height:2px;vertical-align:3px"></i>median</span></div>`
   :metric==='kg'?`<p class="footnote">${birth?'Reference curves cover the first 12 months.':'Add her birth date under Baby to compare against WHO reference curves.'}</p>`:''}`;

  } else {
    const r=row||{t:Date.now()};
    html=`<form id="f-sheet" data-kind="growth"><div class="hd"><h2>${editing?'Edit measurement':'Add measurement'}</h2><button type="button" class="x" data-close aria-label="Close">×</button></div>
      <label class="field">Date<input id="s-date" name="date" type="date" value="${dayKey(r.t)}" required></label>
      <div class="row2"><label class="field">Weight (g)<input id="s-kg" name="kg" type="text" inputmode="numeric" value="${r.kg!=null?Math.round(r.kg*1000):''}" placeholder="4250"></label>
        <label class="field">Length (cm)<input id="s-cm" name="cm" type="text" inputmode="decimal" value="${r.cm??''}" placeholder="55.5"></label>
        <label class="field">Head (cm)<input id="s-head" name="head" type="text" inputmode="decimal" value="${r.head??''}" placeholder="38"></label></div>
      <label class="field">Note<textarea id="s-note" name="note" placeholder="e.g. weighed at the consultatiebureau, after a feed">${esc(r.note)}</textarea></label>
      <div class="form-actions">${editing?`<button type="button" class="btn danger" data-del>Delete</button>`:''}<button class="btn green" type="submit">${editing?'Save changes':'Save measurement'}</button></div></form>`;
  }
  $('#sheet-root').innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#f-sheet');f.dataset.id=row?row.id:'';
  const sync=()=>{const k=(f.querySelector('input[name=kind]:checked')||{}).value;f.querySelectorAll('[data-for]').forEach(el=>{el.hidden=!el.dataset.for.split(' ').includes(k)})};
  f.addEventListener('change',sync);sync();
}
async function submitSheet(f){
  const fd=new FormData(f);const kind=f.dataset.kind;const id=f.dataset.id||uid();
  let coll='events',data;
  if(kind==='feed'){const k=fd.get('kind');data={type:'feed',kind:k,t:new Date(fd.get('t')).getTime()||Date.now(),note:(fd.get('note')||'').trim()};
    if(k==='breast')data.side=fd.get('side')||'L';
    if(k==='breast'||k==='bottle'||k==='formula'){const mn=numOrNull(fd.get('min'));if(mn!=null)data.min=Math.round(mn)}
    if(k==='bottle'||k==='formula'){const ml=numOrNull(fd.get('ml'));if(ml!=null)data.ml=Math.round(ml)}}
  else if(kind==='pump'){data={type:'pump',side:fd.get('side')||'both',t:new Date(fd.get('t')).getTime()||Date.now(),note:(fd.get('note')||'').trim()};const mn=numOrNull(fd.get('min'));if(mn!=null)data.min=Math.round(mn);const ml=numOrNull(fd.get('ml'));if(ml!=null)data.ml=Math.round(ml)}
  else if(kind==='diaper'){const k=fd.get('kind');data={type:'diaper',kind:k,t:new Date(fd.get('t')).getTime()||Date.now(),note:(fd.get('note')||'').trim()};if(k!=='wet'&&fd.get('color'))data.color=fd.get('color')}
  else{coll='growth';const gIn=numOrNull(String(fd.get('kg')||'').replace(/[\s.](?=\d{3}\b)/g,''));const kgv=gIn==null?null:Math.round((gIn<30?gIn*1000:gIn))/1000;
    data={t:keyToMs(fd.get('date')),kg:kgv,cm:numOrNull(fd.get('cm')),head:numOrNull(fd.get('head')),note:(fd.get('note')||'').trim()};
    if(data.kg==null&&data.cm==null&&data.head==null){toast('Enter at least one measurement.');return}}
  closeSheet();const isNew=!f.dataset.id;
  const ok=await guarded(()=>saveRow(coll,id,data),f.dataset.id?'Saved':kind==='growth'?'Measurement saved':kind==='feed'?'Feed logged':kind==='pump'?'Pumping session logged':'Diaper logged');
  if(ok&&isNew&&(kind==='feed'||kind==='pump'))afterLog(kind,data.t);
}

// ---------- toast ----------
let toastTimer;
function toast(msg,undo){
  clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button data-undo>Undo</button>':''}</div>`;
  if(undo)$('#toast-root [data-undo]').onclick=()=>{$('#toast-root').innerHTML='';undo()};
  toastTimer=setTimeout(()=>{$('#toast-root').innerHTML=''},undo?6000:3200);
}

// ---------- events ----------
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button,tr[data-edit],[data-scrim]');if(!t)return;
  if(t.matches('[data-scrim]')){if(ev.target===t)closeSheet();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;if(S.tab==='baby')loadDevices();render();window.scrollTo(0,0);return}
  if(t.dataset.go){S.tab=t.dataset.go;render();return}
  if(t.dataset.new){openSheet(t.dataset.new);return}
  if(t.hasAttribute('data-close')){closeSheet();return}
  if(t.dataset.metric){S.metric=t.dataset.metric;render();return}
  if(t.dataset.hfilter){S.hFilter=t.dataset.hfilter;S.historyDays=7;render();return}
  if(t.hasAttribute('data-more')){S.historyDays+=14;render();return}
  if(t.dataset.editEv){const e=S.events.find(x=>x.id===t.dataset.editEv);if(e)openSheet(e.type,e);return}
  if(t.dataset.edit){const g=S.growth.find(x=>x.id===t.dataset.edit);if(g)openSheet('growth',g);return}
  if(t.dataset.editG){const g=S.growth.find(x=>x.id===t.dataset.editG);if(g)openSheet('growth',g);return}
  if(t.dataset.delG){if(!t.dataset.armed){t.dataset.armed='1';t.textContent='Tap again to delete';t.classList.add('danger-armed');setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='Delete';t.classList.remove('danger-armed')}},4000);return}
    const id=t.dataset.delG;await guarded(()=>removeRow('growth',id),'Measurement deleted');return}
  if(t.dataset.quick){const q=t.dataset.quick;const id=uid();
    const data=q==='breast'?{type:'feed',kind:'breast',side:nextSide(),t:Date.now(),note:''}:{type:'diaper',kind:q,t:Date.now(),note:''};
    const ok=await guarded(()=>saveRow('events',id,data),q==='breast'?`${SIDE[data.side]} breast feed logged`:`${DIAPER[q]} diaper logged`,()=>guarded(()=>removeRow('events',id),'Removed'));if(ok&&q==='breast')afterLog('feed',data.t);return}
  if(t.dataset.remSet){const k=t.dataset.remSet;const last=S.events.find(e=>e.type===k);openRemSheet(k,last&&last.t>Date.now()-12*36e5?last.t:Date.now());return}
  if(t.dataset.snooze){const k=t.dataset.snooze;const d=S.rem.due[k]||Date.now();S.rem.due[k]=Math.max(d,Date.now())+15*60e3;await guarded(saveRem,`Reminder moved to ${fmtTime(S.rem.due[k])}`);render();return}
  if(t.dataset.remClear){S.rem.due[t.dataset.remClear]=null;await guarded(saveRem,'Reminder cleared');render();return}
  if(t.hasAttribute('data-wake')){toggleWake();return}
  if(t.hasAttribute('data-del')){
    if(!t.dataset.armed){t.dataset.armed='1';t.textContent='Tap again to delete';return}
    const f=$('#f-sheet');const coll=f.dataset.kind==='growth'?'growth':'events';const id=f.dataset.id;closeSheet();
    await guarded(()=>removeRow(coll,id),'Deleted');return}
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target;
  if(f.id==='f-sheet')return submitSheet(f);
  if(f.id==='f-rem'&&(f.querySelector('input[name=hrs]:checked')||{}).value==='time'){const k=f.dataset.kind;const at=remAt(f);if(!at){toast('Pick a time for the reminder.');return}
    S.rem.due[k]=at;closeSheet();await guarded(saveRem,`Reminder set for ${dayKey(at)===dayKey(Date.now())?'':'tomorrow '}${fmtTime(at)}`);render();return}
  if(f.id==='f-rem'){const k=f.dataset.kind;const hrs=remHours(f);if(!hrs){toast('Enter between 0.25 and 24 hours.');return}
    S.rem[k].hours=hrs;S.rem[k].auto=$('#r-auto').checked;S.rem.due[k]=+f.dataset.base+hrs*36e5;closeSheet();
    await guarded(saveRem,`Reminder set for ${fmtTime(S.rem.due[k])}`);render();return}
  if(f.id==='f-auto'){const fd=new FormData(f);const fh=numOrNull(fd.get('feedH')),ph=numOrNull(fd.get('pumpH'));
    if(!(fh>=0.25&&fh<=24)||!(ph>=0.25&&ph<=24)){toast('Hours must be between 0.25 and 24.');return}
    const was={feed:S.rem.feed.auto,pump:S.rem.pump.auto};
    S.rem.feed={auto:$('#a-feed').checked,hours:fh};S.rem.pump={auto:$('#a-pump').checked,hours:ph};
    ['feed','pump'].forEach(k=>{if(S.rem[k].auto&&!was[k]&&!S.rem.due[k]){const last=S.events.find(e=>e.type===k);if(last&&last.t+S.rem[k].hours*36e5>Date.now())S.rem.due[k]=last.t+S.rem[k].hours*36e5}});
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
    await guarded(saveRem,'Reminders saved');render();return}
  if(f.id==='f-profile'){const fd=new FormData(f);await guarded(()=>saveProfile({name:(fd.get('name')||'').trim(),birth:fd.get('birth')||'',sex:fd.get('sex')||'girl'}),'Details saved')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
setInterval(()=>{document.querySelectorAll('[data-ago]').forEach(el=>{el.textContent=ago(+el.dataset.ago)});checkDue()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDue()});

// ---------- app-only events ----------
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.hasAttribute('data-retry')){AUTH.status=null;render();loadStatus();return}
  if(t.hasAttribute('data-push-on')){enablePush();return}
  if(t.hasAttribute('data-push-off')){disablePush();return}
  if(t.hasAttribute('data-push-test')){testPush();return}
  if(t.hasAttribute('data-signout')){if(!t.dataset.armed){t.dataset.armed='1';t.textContent='Tap again to sign out';return}signOut('');return}
  if(t.hasAttribute('data-copy-link')){const u=location.origin+'/';try{await navigator.clipboard.writeText(u);toast('Link copied. Send it with the family key.')}catch(e){toast(u)}return}
  if(t.hasAttribute('data-export')){
    const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),profile:S.profile,events:S.events,growth:S.growth},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='baby-care-log-'+dayKey(Date.now())+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return}
});
document.addEventListener('change',async ev=>{
  if(ev.target.id!=='imp'||!ev.target.files[0])return;
  try{
    const d=JSON.parse(await ev.target.files[0].text());
    if(!Array.isArray(d.events)&&!Array.isArray(d.growth))throw 0;
    const r=await api('/import',{method:'POST',body:{events:d.events||[],growth:d.growth||[],profile:d.profile&&d.profile.name&&!S.profile.name?d.profile:null}});
    since=0;await pull();toast(`Imported ${r.imported} entries`);
  }catch(e){toast(e&&e.code==='offline'?'No connection. Try again when online.':"That file isn't a Baby Care Log export.")}
  ev.target.value='';
});
document.addEventListener('submit',ev=>{const f=ev.target;if(f.id==='f-login'||f.id==='f-setup'){ev.preventDefault();submitLogin(f)}});
setInterval(()=>{if(!document.hidden)pull()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
window.addEventListener('online',()=>pull());

// ---------- boot ----------
lsLoad();
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').then(()=>refreshPush()).catch(()=>{})}
render();
if(AUTH.key)pull();else loadStatus();
(()=>{const q=new URLSearchParams(location.search).get('log');if(q&&AUTH.key&&(q==='feed'||q==='pump')){history.replaceState(null,'','/');setTimeout(()=>openSheet(q),250)}})();
})();
</script>
